[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "tokens-doctor"
version = "0.1.0.dev0"
description = "Audit and cut Claude Code's fixed context overhead, and get told when to /compact or /clear."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = []
keywords = ["claude-code", "context", "tokens", "compact"]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[project.scripts]
tokens-doctor = "tokens_doctor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP006", "UP035"]
ignore = ["E501"]
